<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TD-Services Digital – Nouveau site</title>
    <meta http-equiv="refresh" content="3; url=https://tdservices-digital.vercel.app/">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f0f4f8;padding:16px;text-align:center}
        .container{max-width:400px;padding:2.5rem 2rem;background:white;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,0.08)}
        .logo{font-size:3.5rem;display:block}
        h1{font-size:1.6rem;color:#1a1a2e;margin:0.5rem 0}
        h1 span{color:#0057b3}
        p{color:#6c757d}
        .spinner{width:40px;height:40px;border:3px solid #e9ecef;border-top:3px solid #0057b3;border-radius:50%;animation:spin 0.6s linear infinite;margin:1.5rem auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        a{color:#0057b3;text-decoration:none;font-weight:600}
    </style>
</head>
<body>
    <div class="container">
        <span class="logo">🚀</span>
        <h1>TD-Services <span>Digital</span></h1>
        <p>Redirection vers le nouveau site...</p>
        <div class="spinner"></div>
        <p><a href="https://tdservices-digital.vercel.app/">Cliquez ici</a></p>
    </div>
</body>
</html>
